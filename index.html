<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光栅实验室</title><style>*{box-sizing:border-box}body{margin:0;background:#0c121c;color:#e8f5f5;font:14px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:17px 20px;border-bottom:1px solid #344454;font-size:20px;font-weight:bold}em{color:#69e4d3;font-style:normal}main{display:grid;grid-template-columns:280px 1fr;gap:18px;padding:18px}aside{background:#15212c;padding:17px;border-radius:12px}h2{font-size:13px;color:#69e4d3}label{display:flex;justify-content:space-between;margin:15px 0 6px}input[type=range]{width:100%;accent-color:#69e4d3}button,.upload,select{padding:10px;background:#203544;color:white;border:1px solid #4b6471;border-radius:8px;cursor:pointer;font:inherit}.upload{display:inline-block}input[type=file]{display:none}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row>*{flex:1}select{width:100%}.stage{height:65vh;min-height:320px;border:1px solid #344454;border-radius:12px;position:relative;overflow:hidden;touch-action:pan-y;background:repeating-linear-gradient(0deg,#14202c 0px,#14202c 24px,#192733 25px)}canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:85%;max-height:80%;box-shadow:0 12px 30px #0008}.card{position:absolute;top:18px;left:10px;border:2px solid #69e4d3;box-shadow:0 5px 20px #000a;touch-action:none;cursor:grab;overflow:hidden}.stripe{position:absolute;inset:0;pointer-events:none}.handle{position:absolute;top:0;left:0;right:0;text-align:center;font-size:10px;padding:4px;background:#15343fbb;pointer-events:none}p{color:#9fb4bd;line-height:1.6}output{color:#69e4d3}@media(max-width:720px){main{display:flex;flex-direction:column;padding:12px}article{order:0}aside{order:1}.stage{height:48vh;min-height:300px}}</style><header>▦ 光栅<em>实验室</em> · Scanimation Studio</header><main><aside><h2>01 / 素材与参数</h2><div class="row"><label class="upload">＋ 上传 2–12 张<input id="upload" type="file" accept="image/*" multiple></label><button id="demo">演示动画</button></div><label>条纹宽度 <output id="swVal"></output></label><input id="sw" type="range" min="2" max="12" value="4"><label>卡片宽度 <output id="cwVal"></output></label><input id="cw" type="range" min="100" max="420" value="240"><label>卡片高度 <output id="chVal"></output></label><input id="ch" type="range" min="80" max="380" value="210"><label>扫描方向</label><select id="dir"><option value="v">竖条纹 / 左右移动</option><option value="h">横条纹 / 上下移动</option></select><label>导出宽度 <output id="resVal"></output></label><input id="res" type="range" min="400" max="1600" step="100" value="900"><div class="row"><button id="reset">重置卡片</button><button id="play">▶ 自动扫描</button></div><p id="status">内置演示已加载</p></aside><article><h2>02 / 实时扫描</h2><p>用手指拖动绿色边框的光栅卡到图片上，沿条纹垂直方向滑动。</p><div id="stage" class="stage"><canvas id="art"></canvas><div id="card" class="card"><div id="stripe" class="stripe"></div><div class="handle">⠿ 拖动光栅卡</div></div></div><h2>03 / 导出打印</h2><div class="row"><button id="out">底图 PNG</button><button id="mask">透明卡 PNG</button><button id="svg">光栅卡 SVG</button></div><p>预览采用低分辨率加速；导出生成高分辨率底图。打印时请保持底图和卡片同一比例。</p></article></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),art=$('art'),ctx=art.getContext('2d'),card=$('card'),stripe=$('stripe'),stage=$('stage');let frames=[],drag=null,anim=0,playing=false,token=0;const n=id=>+$ (id).value,V=()=>$('dir').value==='v';function labels(){for(const id of ['sw','cw','ch','res'])$(id+'Val').textContent=n(id)+' px'}function demo(){frames=[];for(let i=0;i<6;i++){let c=document.createElement('canvas');c.width=480;c.height=320;let x=c.getContext('2d');x.fillStyle='#f2f2ec';x.fillRect(0,0,480,320);x.strokeStyle='#d4e1dc';for(let y=30;y<320;y+=24){x.beginPath();x.moveTo(0,y);x.lineTo(480,y);x.stroke()}x.fillStyle='#183b41';x.font='bold 22px sans-serif';x.fillText('MOTION STUDY',25,43);x.fillStyle='#10bfa9';x.beginPath();x.arc(95+i*55,160+Math.sin(i*Math.PI/3)*35,35,0,7);x.fill();frames.push(c)}render()}function source(im,w,h){let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,w,h);let iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,s=Math.min(w/iw,h/ih);x.drawImage(im,(w-iw*s)/2,(h-ih*s)/2,iw*s,ih*s);return x.getImageData(0,0,w,h).data}function interlace(w,h){let imgs=frames.map(im=>source(im,w,h)),c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d'),out=x.createImageData(w,h),d=out.data,sw=n('sw'),N=imgs.length;if(V()){for(let col=0;col<w;){let f=Math.floor(col/sw)%N,k=Math.min(sw-col%sw,w-col),src=imgs[f];for(let y=0;y<h;y++){let p=(y*w+col)*4;d.set(src.subarray(p,p+k*4),p)}col+=k}}else{for(let y=0;y<h;y++){let p=y*w*4;d.set(imgs[Math.floor(y/sw)%N].subarray(p,p+w*4),p)}}x.putImageData(out,0,0);return c}function render(){let id=++token;labels();requestAnimationFrame(()=>{if(id!==token)return;let c=interlace(480,320);art.width=480;art.height=320;ctx.drawImage(c,0,0);maskStyle()})}function maskStyle(){let scale=art.getBoundingClientRect().width/480||1,sw=n('sw')*scale,p=sw*frames.length;card.style.width=n('cw')*scale+'px';card.style.height=n('ch')*scale+'px';let direction=V()?'right':'bottom';stripe.style.backgroundImage='repeating-linear-gradient(to '+direction+',transparent 0px,transparent '+sw+'px,#030709 '+sw+'px,#030709 '+p+'px)'}function move(x,y){card.style.transform='translate3d('+x+'px,'+y+'px,0)';card.dataset.x=x;card.dataset.y=y}function stop(){playing=false;cancelAnimationFrame(anim);$('play').textContent='▶ 自动扫描'}card.addEventListener('pointerdown',e=>{stop();drag={id:e.pointerId,x:e.clientX,y:e.clientY,ox:+card.dataset.x||0,oy:+card.dataset.y||0};card.setPointerCapture(e.pointerId);e.preventDefault()});card.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;move(drag.ox+e.clientX-drag.x,drag.oy+e.clientY-drag.y)});for(let type of ['pointerup','pointercancel','lostpointercapture'])card.addEventListener(type,e=>{if(drag&&drag.id===e.pointerId)drag=null});$('reset').onclick=()=>{stop();move(10,18)};$('demo').onclick=()=>{stop();demo()};let tick=()=>{if(!playing)return;let key=V()?'x':'y',v=(+card.dataset[key]||0)+2.2,limit=V()?stage.clientWidth:stage.clientHeight;if(v>limit)v=-(V()?card.offsetWidth:card.offsetHeight);move(key==='x'?v:(+card.dataset.x||0),key==='y'?v:(+card.dataset.y||0));anim=requestAnimationFrame(tick)};$('play').onclick=()=>{if(playing){stop();return}playing=true;$('play').textContent='Ⅱ 暂停';tick()};for(let id of ['sw','dir'])$(id).addEventListener('input',render);for(let id of ['cw','ch'])$(id).addEventListener('input',()=>{labels();maskStyle()});$('res').oninput=labels;$('upload').onchange=async e=>{let fs=[...e.target.files].slice(0,12);if(fs.length<2){alert('请至少上传两张图片');return}try{frames=await Promise.all(fs.map(f=>new Promise((ok,bad)=>{let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=bad;im.src=u})));render();stop();$('status').textContent='已载入 '+frames.length+' 帧'}catch(err){alert('图片读取失败')}};function dl(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}function png(c,name){c.toBlob(b=>b&&dl(b,name),'image/png')}function maskSvg(){let w=n('cw'),h=n('ch'),sw=n('sw'),pitch=sw*frames.length,rs='';if(V()){for(let a=sw;a<w;a+=pitch)rs+='<rect x="'+a+'" y="0" width="'+Math.min(pitch-sw,w-a)+'" height="'+h+'"/>'}else{for(let a=sw;a<h;a+=pitch)rs+='<rect x="0" y="'+a+'" width="'+w+'" height="'+Math.min(pitch-sw,h-a)+'"/>'}return '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'"><g fill="black">'+rs+'</g></svg>'}$('svg').onclick=()=>dl(new Blob([maskSvg()],{type:'image/svg+xml'}),'scanimation_card.svg');$('mask').onclick=()=>{let c=document.createElement('canvas');c.width=n('cw');c.height=n('ch');let x=c.getContext('2d'),sw=n('sw'),p=sw*frames.length;x.fillStyle='black';if(V()){for(let a=sw;a<c.width;a+=p)x.fillRect(a,0,Math.min(p-sw,c.width-a),c.height)}else{for(let a=sw;a<c.height;a+=p)x.fillRect(0,a,c.width,Math.min(p-sw,c.height-a))}png(c,'scanimation_card.png')};$('out').onclick=()=>{let w=n('res');$('status').textContent='正在生成高清图片…';setTimeout(()=>{png(interlace(w,Math.round(w*2/3)),'scanimation_interlaced.png');$('status').textContent='导出完成'},30)};window.addEventListener('resize',maskStyle);demo();move(10,18)})();</script></html>
