<script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage'),overlay=$('overlay'),hint=$('hint');let mode=0,imgs=[],pos=0,run=false,raf=0,settings={stripe:4,phase:0},textValue='不止眼前',story=0;const modes=[['光栅动画','把隐藏动画发到朋友圈','SCAN / REVEAL','▥','上传 2–8 张照片，生成光栅底图与透明卡。实体卡可直接扫描，iPhone 跨 App 拖动仍需真机校准。'],['刮刮乐','刮开另一面的惊喜','SCRATCH / DISCOVER','✦','上传照片或使用示例，手指擦掉表面涂层，揭开隐藏的画面。'],['倾斜幻象','手机一倾斜，世界就变了','TILT / SWITCH','◒','倾斜手机或左右拖动，切换两种画面。iPhone 可能需要授权运动传感器。'],['动态文字','让一句话活过来','TYPE / PLAY','Aa','输入文字，拖动手指制造波浪和动态字形。'],['液态照片','手指触碰，照片荡漾','TOUCH / RIPPLE','≈','上传照片，用手指在画面上制造实时水波纹。'],['照片故事','把瞬间变成互动故事','SWIPE / STORY','▤','上传多张照片，左右滑动翻阅；也可保存当前故事卡片。']];function button(label,fn,kind=''){let b=document.createElement('button');b.className='btn '+kind;b.textContent=label;b.onclick=fn;$('actions').appendChild(b)}function field(label,value,min,max,fn){let d=document.createElement('div');d.className='field';d.innerHTML='<label>'+label+' <span>'+value+'</span></label><input type="range" min="'+min+'" max="'+max+'" value="'+value+'">';let i=d.querySelector('input'),v=d.querySelector('span');i.oninput=()=>{v.textContent=i.value;fn(+i.value)};$('controls').appendChild(d)}function fileInput(multiple=false){let l=document.createElement('label');l.className='file';l.textContent=multiple?'＋ 上传多张照片（2–8 张）':'＋ 上传一张自己的照片';let i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=multiple;l.appendChild(i);$('controls').appendChild(l);i.onchange=async()=>{let fs=[...i.files].slice(0,multiple?8:1);if(!fs.length)return;try{let arr=await Promise.all(fs.map(f=>new Promise((ok,bad)=>{let im=new Image(),url=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(url);ok(im)};im.onerror=bad;im.src=url})));imgs=arr;story=0;render();if(mode===1)resetScratch()}catch(e){alert('图片加载失败，请换一张试试')}}}function base(c=ctx,w=600,h=750,variant=0){c.clearRect(0,0,w,h);let g=c.createLinearGradient(0,0,w,h);let colors=[['#a9e2e7', b1416 '+slit+'px,#0b1416 '+pitch+'px)';overlay.appendChild(card);let down=null;card.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,left:card.offsetLeft,top:card.offsetTop};card.setPointerCapture(e.pointerId);e.preventDefault()});card.addEventListener('pointermove',e=>{if(!down)return;card.style.left=down.left+e.clientX-down.x+'px';card.style.top=down.top+e.clientY-down.y+'px'});card.addEventListener('pointerup',()=>down=null);card.addEventListener('pointercancel',()=>down=null);hint.textContent='拖动光栅卡'}function download(c,name){c.toBlob(b=>{if(!b)return;let a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)},'image/png')}function downloadCard(){let w=600,h=750,n=imgs.length||4,p=settings.stripe*n,c=canvasFor(w,h),x=c.getContext('2d');x.fillStyle='#0b1416';for(let col=settings.stripe;col<w;col+=p)x.fillRect(col,0,p-settings.stripe,h);download(c,'PLAY-透明光栅卡.png')}function saveCurrent(){let c=canvasFor();c.getContext('2d').drawImage(canvas,0,0);download(c,'PLAY-'+['光栅底图','刮刮乐','倾斜幻象','动态文字','液态照片','照片故事'][mode]+'.png')}function resetScratch(){let top=canvasFor(),c=top.getContext('2d');c.fillStyle='#252c2b';c.fillRect(0,0,600,750);c.fillStyle='#d8ff5c';c.textAlign='center';c.font='bold 56px sans-serif';c.fillText('SCRATCH ME',300,370);c.font='24px sans-serif';c.fillText('刮开看看下面有什么 ↗',300,420);let o=canvasFor(),oc=o.getContext('2d');scene(oc,600,750,imgs.length?0:1);ctx.drawImage(o,0,0);let mask=document.createElement('canvas');mask.width=600;mask.height=750;mask.style.cssText='position:absolute;inset:0;width:100%;height:100%;touch-action:none';overlay.replaceChildren(mask);let mc=mask.getContext('2d');mc.drawImage(top,0,0);let active=false;function erase(e){let r=mask.getBoundingClientRect(),x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*750/r.height;mc.globalCompositeOperation='destination-out';mc.beginPath();mc.arc(x,y,43,0,7);mc.fill()}mask.onpointerdown=e=>{act
