/* ART DIRECTION / INK BLACK */
:root{--ink:#fafaf7;--muted:#b9b9b4;--paper:#050505;--lime:#dfff66;--line:#323232}
body{background:#050505;color:#fafaf7;-webkit-font-smoothing:antialiased}
header{background:rgba(5,5,5,.92);border-bottom:1px solid #292929}
.brand{font-family:"Arial Black",Impact,"Helvetica Neue",sans-serif;font-weight:900;letter-spacing:-1.7px;color:#fff}
.brand span{color:#dfff66;letter-spacing:.11em;font-size:10px;font-weight:650}
.nav{color:#e1e1dd;transition:background .2s,color .2s}
.nav.active{background:#f5f5f0;color:#080808}
.nav:hover:not(.active){background:#202020;color:#fff}
main{max-width:1380px}
.hero{min-height:550px;padding:75px 0 95px;grid-template-columns:1fr .85fr;overflow:hidden}
.hero h1{font-family:"Bodoni MT","Didot","Times New Roman","Noto Serif SC","Songti SC",serif;font-size:clamp(80px,10vw,158px);font-weight:700;line-height:.96;letter-spacing:-.095em;margin:15px 0 35px}
.hero h1 i{font-family:"Bodoni MT","Didot","Times New Roman","Noto Serif SC","Songti SC",serif;font-weight:400;font-style:italic;color:#dfff66}
.hero-cn{font-family:"Noto Serif SC","Songti SC","STSong",serif}
.hero-asterisk{display:inline-block;font-family:Georgia,serif;font-size:.3em;vertical-align:top;margin:.05em 0 0 .15em;color:#fff;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-art{width:min(33vw,420px);height:auto;max-width:none;aspect-ratio:1;border-radius:50%;position:relative;overflow:visible;isolation:isolate;justify-self:center;background:radial-gradient(circle at 37% 24%,#fff 0%,#b6f6eb 4%,#2a6d6c 14%,transparent 31%),radial-gradient(ellipse at 64% 70%,#091016 8%,#153941 28%,#a5d8ce 49%,#070b0e 73%);box-shadow:inset -25px -28px 42px #000b,0 0 0 1px #445d5b,0 0 100px #7dffd414;filter:none;animation:float 8s ease-in-out infinite}
.hero-art:before{content:"";position:absolute;inset:10%;border:1px solid #c8fff268;border-radius:50%;transform:rotate(-28deg) scaleY(.45);box-shadow:0 0 20px #96f5e544}
.hero-art:after{content:"";position:absolute;inset:5%;border-radius:50%;background:linear-gradient(120deg,transparent 28%,#ffffff22 35%,transparent 40%,transparent 70%,#dfff661b 78%,transparent 82%);mix-blend-mode:screen}
.orbit{position:absolute;inset:-12%;border:1px solid #dfff6666;border-radius:50%;transform:rotate(35deg) scaleY(.43);pointer-events:none}
.orbit-b{transform:rotate(-40deg) scaleY(.61);border-color:#a6fff344}
.hero-core{position:absolute;inset:37%;border-radius:50%;background:radial-gradient(circle at 28% 28%,#fff,#dfff66 23%,#37614b 62%,#06100b);box-shadow:0 0 38px #dfff6655}
.art-mark{position:absolute;inset:0;display:grid;place-items:center;color:#ffffffc9;font-family:Didot,Georgia,serif;font-style:italic;font-size:clamp(95px,15vw,220px);font-weight:700;text-shadow:0 5px 45px #0009;mix-blend-mode:screen}
.art-mark span{font-size:.23em;position:absolute;right:24%;top:21%;color:#dfff66}
.section-head{border-top:1px solid #333;padding-top:24px;margin-top:0;margin-bottom:25px}
.section-head h2{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(30px,4vw,50px);font-weight:600;letter-spacing:-.06em}
.heading-mark{font-family:Georgia,serif;color:#dfff66;font-weight:400;font-size:.5em;vertical-align:top}
.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 16px}
.tile{border:0;background:transparent;overflow:visible;box-shadow:none;text-align:left}
.tile-visual{height:clamp(210px,24vw,330px);border-radius:3px;position:relative;isolation:isolate;filter:none!important;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.tile:hover .tile-visual{transform:translateY(-5px);box-shadow:0 22px 55px #0008}
.tile-visual:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 35% 25%,#fff4,transparent 30%),linear-gradient(135deg,#ffffff18,transparent 40%,#0005)}
.tile-visual b{position:relative;z-index:1;font-family:Didot,Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(100px,13vw,185px);line-height:1;color:#fff;letter-spacing:-.11em;text-shadow:0 8px 30px #0007;transition:transform .4s}
.tile:hover .tile-visual b{transform:rotate(-8deg) scale(1.08)}
.tile:nth-child(1) .tile-visual{background:radial-gradient(circle at 30% 30%,#a8d1e7,#263b64 50%,#0a111c)}
.tile:nth-child(1) .tile-visual b{background:repeating-linear-gradient(90deg,#f8ffff 0 3px,#091a31 3px 7px);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 7px 12px #0007)}
.tile:nth-child(2) .tile-visual{background:radial-gradient(circle at 28% 18%,#fff8a6,#d2f368 40%,#45631c)}
.tile:nth-child(2) .tile-visual b{color:#12210d;transform:rotate(-12deg)}
.tile:nth-child(3) .tile-visual{background:radial-gradient(circle at 24% 20%,#ffe0d7,#cc7899 46%,#422044)}
.tile:nth-child(4) .tile-visual{background:radial-gradient(circle at 25% 20%,#e7d5ff,#7951bd 50%,#171329)}
.tile:nth-child(5) .tile-visual{background:radial-gradient(circle at 24% 18%,#d5fff2,#389e9b 43%,#0a2932)}
.tile:nth-child(6) .tile-visual{background:radial-gradient(circle at 25% 18%,#fff0bd,#bd794e 45%,#372126)}
.art-index{position:absolute;z-index:3;left:18px;top:15px;color:#fff;font-family:Georgia,serif;font-size:14px;letter-spacing:.1em;text-shadow:0 1px 8px #0008}
.art-arrow{position:absolute;z-index:3;right:17px;bottom:13px;font-family:Georgia,serif;font-size:26px;color:#fff;text-shadow:0 1px 8px #0008}
.tile-info{display:flex;justify-content:space-between;align-items:center;padding:17px 0 12px;border-bottom:1px solid #393939}
.tile-info strong{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;font-size:23px;letter-spacing:-.05em;color:#fff}
.tile-open{font-size:22px;color:#dfff66}
.panel h3{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:600;font-size:40px}
.panel .file{border:1px solid #575757;background:#171717;color:#fff}
.panel .file:hover{border-color:#dfff66}
.field label{color:#f4f4f0}
.field input[type=range]{accent-color:#dfff66}
.field input[type=text],.field select{background:#141414;border-color:#525252;color:#fff}
.btn{background:#f7f7f3;color:#090909;border-color:#f7f7f3}
.btn.alt{background:#161616;border-color:#666;color:#fff}
.btn.lime{background:#dfff66;border-color:#dfff66;color:#0b0b0b}
.note{background:#151515;color:#d1d1cc}
.advanced{color:#e2e2de}
.preview-shell{background:#101010;border:1px solid #353535}
.preview-head{color:#f5f5f0}
.foot{border-color:#2d2d2d;color:#a8a8a3}
@media(max-width:850px){.hero{min-height:400px}.hero h1{font-size:clamp(70px,11vw,110px)}.hero-art{width:220px}.tile-visual{height:220px}}
@media(max-width:480px){.hero{min-height:340px;padding:54px 0 55px;grid-template-columns:1fr 110px;gap:0}.hero h1{font-size:clamp(55px,14vw,76px);margin:18px 0}.hero-art{width:105px}.art-mark{font-size:80px}.hero-asterisk{font-size:.23em}.cards{gap:22px 11px}.tile-visual{height:168px}.tile-visual b{font-size:93px}.tile-info strong{font-size:18px}.tile-info{padding:13px 0 8px}.art-index{top:10px;left:11px;font-size:11px}.art-arrow{right:10px;bottom:7px;font-size:19px}.section-head h2{font-size:33px}.panel h3{font-size:32px}}
@media(prefers-reduced-motion:reduce){.hero-art,.hero-asterisk{animation:none}.tile,.tile-visual,.tile-visual b{transition:none}}

/* MINIMAL SWIPE GALLERY */
body.on-home{background:#000}
body.on-home header{height:74px;background:#000;border:0;padding:0 clamp(20px,5vw,75px)}
body.on-home .brand{font-family:Georgia,serif;font-weight:500;font-size:24px;letter-spacing:-.06em}
body.on-home .brand span{display:none}
body.on-home nav{display:none}
body.on-home main{max-width:none;padding:0}
body.on-home .foot{display:none}
.gallery-home{height:calc(100dvh - 74px);min-height:570px;background:#000;position:relative;display:flex;flex-direction:column;overflow:hidden}
.gallery-heading{display:flex;justify-content:space-between;padding:20px clamp(22px,6vw,90px);font:12px Georgia,serif;letter-spacing:.18em;color:#fff}
.gallery-scene{position:relative;flex:1;min-height:0;display:flex;align-items:center}
.gallery-line{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:.95}
.gallery-line path{fill:none;stroke:#fff;stroke-width:1.7;vector-effect:non-scaling-stroke;stroke-linecap:round}
.gallery-track{width:100%;height:100%;display:flex;align-items:center;gap:clamp(38px,7vw,130px);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 max(25vw,calc((100vw - 440px)/2));touch-action:pan-x pan-y}
.gallery-track::-webkit-scrollbar{display:none}
.gallery-item{flex:0 0 clamp(230px,30vw,380px);height:clamp(240px,32vw,385px);position:relative;scroll-snap-align:center;scroll-snap-stop:always;background:#090909d9;border:1.5px solid #fff;color:#fff;border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .25s,transform .25s;backdrop-filter:blur(8px)}
.gallery-item:nth-child(2n){transform:translateY(65px)}
.gallery-item:nth-child(3n){transform:translateY(-45px)}
.gallery-item:hover{background:#1a1a1a}
.gallery-number{position:absolute;top:19px;left:22px;font:13px Georgia,serif;letter-spacing:.1em}
.gallery-symbol{font:normal clamp(95px,12vw,170px) Georgia,"Times New Roman",serif;line-height:1;letter-spacing:-.09em;color:#fff}
.gallery-name{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-size:clamp(23px,2.5vw,33px);letter-spacing:.02em;margin-top:25px}
.gallery-enter{position:absolute;bottom:16px;right:20px;font:25px Georgia,serif}
.gallery-bottom{height:118px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,75px);gap:20px}
.gallery-dock{display:flex;align-items:center;gap:12px;padding:8px 13px;border:1px solid #444;background:#181818;border-radius:100px}
.gallery-dock button{width:45px;height:45px;border:0;border-radius:50%;background:none;color:white;font:28px Georgia,serif}
.gallery-dock button:active{background:#393939}
.dock-rule{width:1px;height:23px;background:#454545}
.gallery-swipe{color:#c9c9c9;font:11px Georgia,serif;letter-spacing:.25em}
.gallery-launch{border:1px solid #555;border-radius:50%;background:#202020;color:white;width:62px;height:62px;font:34px Georgia,serif}
@media(max-width:600px){
body.on-home header{height:60px;padding:0 25px}
body.on-home .brand{font-size:21px}
.gallery-home{height:calc(100dvh - 60px);min-height:510px}
.gallery-heading{padding:12px 24px;font-size:11px}
.gallery-line{top:6%;height:82%}
.gallery-track{gap:54px;padding:0 calc((100vw - 230px)/2)}
.gallery-item{flex-basis:230px;height:275px;background:#080808ec}
.gallery-item:nth-child(2n){transform:translateY(56px)}
.gallery-item:nth-child(3n){transform:translateY(-34px)}
.gallery-symbol{font-size:112px}
.gallery-name{font-size:24px;margin-top:17px}
.gallery-bottom{height:110px;padding:0 22px}
.gallery-dock{gap:4px;padding:7px 8px}
.gallery-dock button{width:40px;height:42px;font-size:26px}
.gallery-swipe{display:none}
.gallery-launch{width:56px;height:56px}
